name: Mine intelligence packet

on:
  workflow_dispatch:
    inputs:
      job_json:
        description: "Job JSON completo (seed, depth, country, sources, keywords)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mineracao-info-manual
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
      JOB_JSON: ${{ inputs.job_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "APIFY_API_TOKEN não configurado nos Secrets do repositório."
            exit 1
          fi

      - name: Create job file
        shell: bash
        run: python -c "import os, pathlib; pathlib.Path('job.json').write_text(os.environ['JOB_JSON'], encoding='utf-8')"

      - name: Execute engine
        env:
          PYTHONPATH: src
        run: python -m mineracao_info.cli run-job job.json --result-file action-result.json

      - name: Prepare compact results
        shell: bash
        run: |
          JOB_ID=$(python -c "import json; print(json.load(open('action-result.json', encoding='utf-8'))['job_id'])")
          mkdir -p results/latest "results/$JOB_ID"
          cp "outputs/$JOB_ID/REPORT.md" results/latest/REPORT.md
          cp "outputs/$JOB_ID/summary.json" results/latest/summary.json
          cp "outputs/$JOB_ID/score.json" results/latest/score.json
          cp "outputs/$JOB_ID/REPORT.md" "results/$JOB_ID/REPORT.md"
          cp "outputs/$JOB_ID/summary.json" "results/$JOB_ID/summary.json"
          cp "outputs/$JOB_ID/score.json" "results/$JOB_ID/score.json"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Upload full intelligence packet
        uses: actions/upload-artifact@v4
        with:
          name: mineracao-info-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 14

      - name: Commit compact reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/latest "results/$JOB_ID"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração compacta para versionar."
          else
            git commit -m "results: update intelligence packet $JOB_ID [skip ci]"
            git push
          fi
